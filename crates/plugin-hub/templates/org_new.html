{% extends "layout.html" %}
{% block title %}新建组织 · a_da 插件库{% endblock %}
{% block content %}
<div class="mx-auto max-w-xl">
  <a href="/orgs" class="text-sm text-slate-500 hover:underline">← 返回组织</a>
  <h1 class="mt-3 text-2xl font-semibold">新建组织</h1>
  <p class="mt-1 text-sm text-slate-500">组织名会成为插件 URL 的一部分，创建后不可修改。</p>
  {% if let Some(error) = error.as_ref() %}
  <div class="mt-4 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800">{{ error }}</div>
  {% endif %}
  <form method="post" action="/orgs" class="mt-6 space-y-4 rounded-2xl border border-slate-200 bg-white p-5">
    <input type="hidden" name="_csrf" value="{{ common.csrf }}">
    <label class="block">
      <span class="text-sm font-medium">组织名</span>
      <input name="name" required minlength="2" maxlength="40" placeholder="acme"
             class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm font-mono outline-none focus:border-slate-500">
    </label>
    <label class="block">
      <span class="text-sm font-medium">显示名称</span>
      <input name="display_name" required maxlength="80" placeholder="Acme Plugins"
             class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-500">
    </label>
    <label class="block">
      <span class="text-sm font-medium">简介</span>
      <textarea name="description" rows="3" maxlength="300"
                class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-500"></textarea>
    </label>
    <button type="submit" class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-700">创建组织</button>
  </form>
</div>
{% endblock %}
