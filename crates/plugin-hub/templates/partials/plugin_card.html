<article class="flex h-full flex-col rounded-2xl border border-slate-200 bg-white p-4 transition hover:border-slate-300 hover:shadow-sm">
  <div class="flex items-start justify-between gap-3">
    <a href="/plugins/{{ p.owner }}/{{ p.slug }}" class="truncate text-sm font-semibold hover:text-blue-700">{{ p.name }}</a>
    <span class="shrink-0 rounded-full bg-slate-100 px-2 py-0.5 text-[11px] text-slate-600">{{ p.stars }} ★</span>
  </div>
  <p class="mt-2 line-clamp-2 min-h-10 text-xs leading-5 text-slate-600">{{ p.description }}</p>
  <div class="mt-3 flex flex-wrap items-center gap-1.5">
    {% for tag in p.tags_list() %}
    <span class="rounded-md bg-blue-50 px-1.5 py-0.5 text-[10px] text-blue-700">#{{ tag }}</span>
    {% endfor %}
  </div>
  <div class="mt-auto flex items-center justify-between pt-4 text-[11px] text-slate-500">
    <a class="truncate hover:text-blue-700" href="{{ p.owner_href() }}">@{{ p.owner }}</a>
    <span>{{ p.downloads }} ↓ · {{ p.updated_text() }}</span>
  </div>
</article>
