{% if common.current_user.is_some() %}
<form hx-post="/plugins/{{ plugin.owner }}/{{ plugin.slug }}/star" hx-target="#star-button" hx-swap="outerHTML">
  <input type="hidden" name="_csrf" value="{{ common.csrf }}">
  <button type="submit" class="inline-flex items-center gap-2 rounded-xl border px-3 py-2 text-sm font-medium {% if starred %}border-amber-300 bg-amber-50 text-amber-800{% else %}border-slate-300 bg-white text-slate-800 hover:bg-slate-50{% endif %}">
    <span>{% if starred %}★ 已 Star{% else %}☆ Star{% endif %}</span>
    <span class="rounded-full bg-black/5 px-2 py-0.5 text-xs">{{ stars }}</span>
  </button>
</form>
{% else %}
<a href="/login?next=/plugins/{{ plugin.owner }}/{{ plugin.slug }}" class="inline-flex items-center gap-2 rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-800 hover:bg-slate-50">
  ☆ Star <span class="rounded-full bg-black/5 px-2 py-0.5 text-xs">{{ stars }}</span>
</a>
{% endif %}
