{% extends "layout.html" %}
{% block title %}发布新版本 · {{ name }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl">
  <a href="/plugins/{{ owner }}/{{ slug }}" class="text-sm text-slate-500 hover:underline">← 返回 {{ name }}</a>
  <h1 class="mt-3 text-2xl font-semibold">发布新版本</h1>
  <p class="mt-1 text-sm text-slate-500">上传插件 ZIP（最多包含 500 个条目、解压后不超过 50 MB）。</p>
  {% if let Some(error) = error.as_ref() %}
  <div class="mt-4 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800">{{ error }}</div>
  {% endif %}
  <form method="post" action="/plugins/{{ owner }}/{{ slug }}/releases/new" enctype="multipart/form-data"
        class="mt-6 space-y-5 rounded-2xl border border-slate-200 bg-white p-5">
    <input type="hidden" name="_csrf" value="{{ common.csrf }}">
    <label class="block">
      <span class="text-sm font-medium">版本号</span>
      <input name="version" required maxlength="32" placeholder="0.1.0"
             class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm font-mono outline-none focus:border-slate-500">
    </label>
    <label class="block">
      <span class="text-sm font-medium">发布说明</span>
      <textarea name="notes" rows="5"
                class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-500"></textarea>
    </label>
    <label class="block">
      <span class="text-sm font-medium">插件 ZIP</span>
      <input type="file" name="asset" accept=".zip,application/zip" required
             class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
    </label>
    <button type="submit" class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-700">发布</button>
  </form>
</div>
{% endblock %}
