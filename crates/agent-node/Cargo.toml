[package]
name = "agent-node"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Agent 节点：会话、审批、检查点、委派、插件与技能（无协议管道、无 UI 投影）"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }

# 独立的 TS 脚本与转译引擎（插件沙箱）
ada-ts-engine = { workspace = true }

# 基座分层
agent-base = { workspace = true }
agent-proto = { workspace = true }
agent-adapter = { workspace = true }
agent-toolkit = { workspace = true }
agent-runtime = { workspace = true }

[dev-dependencies]
# P1·SP-19：脚本宿主的端口契约由合规套件提供（只依赖基座各 crate，无环）
agent-conformance = { workspace = true }

# P4·SP-70：插件**子进程入口**。它必须与本 crate 同源（要用 `PluginSandbox`），
# 所以作为本 crate 的 bin 目标——调用方（宿主 / 测试）按可执行文件路径启动它。
[[bin]]
name = "runner"
path = "src/bin/runner.rs"
