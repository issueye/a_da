[package]
name = "agent-web"
version.workspace = true
edition = "2021"
description = "a_da SSR web UI: projection layer mounted by the gateway (product code name: ssr-h)"
license.workspace = true

[lib]
name = "agent_web"
path = "src/lib.rs"

# 过渡期的独立运行入口：开发与实机验收用，不随网关发布。
[[bin]]
name = "ssr-h"
path = "src/main.rs"

[dependencies]
agent-proto = { workspace = true }
ammonia = { workspace = true }
anyhow = { workspace = true }
askama = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
futures-util = { workspace = true }
pulldown-cmark = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

# ── TSX 运行时（OXC + Boa）──────────────────────────────────────────────
# TSX → OXC（去类型 + JSX classic pragma `h`）→ Boa（无宿主环境）→ VNode JSON
# → Rust `ui` 组件渲染。已接入插件注册表（.tsx 页面/插槽/仪表盘）。
boa_engine = { workspace = true }
oxc_allocator = { workspace = true }
oxc_ast = { workspace = true }
oxc_codegen = { workspace = true }
oxc_parser = { workspace = true }
oxc_semantic = { workspace = true }
oxc_span = { workspace = true }
oxc_transformer = { workspace = true }
