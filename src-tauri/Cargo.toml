[package]
name = "ada-tauri"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "a_da AI coding assistant Tauri frontend"

[features]
# 🔴 **生产出包必须带上它**（`tauri build` 会自动加，`cargo build --release` 不会）。
#
# tauri 的 build.rs 里判据是 `dev = !custom_protocol`：**不带这个 feature 时，连 release
# 构建都被当成 dev**，运行时会去加载 `build.devUrl`（http://localhost:1420）而不是内嵌的
# 前端产物——于是"免安装包双击打开是一扇空白窗"。官方模板靠这个 feature 区分 dev/prod。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
# `devtools`：桌面壳要提供 F12 / Ctrl+Shift+I 打开开发者工具（与 Electron 宿主对齐）
tauri = { version = "2.4.0", features = ["devtools"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
agent-proto = { workspace = true }
agent-node = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security"] }
