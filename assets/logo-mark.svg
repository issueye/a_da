    d="M5.6 6.6 L9.4 12 L5.6 17.4"
    fill="none"
    stroke="#000"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <rect x="11.6" y="15.2" width="6.4" height="2.8" rx="1.4" fill="#000"/>
</svg>
