<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!--
    The prompt mark from logo.svg without the tile, on a 24 grid, so it can be
    drawn at any size and tinted through `style.color` like every other icon.
  -->
