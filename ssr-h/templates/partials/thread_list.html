{% if threads.is_empty() %}
<p class="ada-thread-list__empty">还没有会话</p>
{% else %}
{% for t in threads %}
<a class="ada-thread{% if t.id == active_thread_id %} is-active{% endif %}" href="/threads/{{ t.id }}" title="{{ t.title }}">
  <span class="ada-thread__title">{{ t.title }}</span>
  <span class="ada-thread__meta">
    {% if t.running %}<span class="ada-thread__running"><span class="ada-dot ada-dot--warn"></span>运行中</span>{% endif %}
    <span>{{ t.item_count }} 项</span>
  </span>
</a>
{% endfor %}
{% endif %}
