[package]
name = "ssr-h"
version = "0.1.0"
edition = "2021"
description = "a_da SSR agent frontend prototype with runtime frontend plugins"
license = "MIT"

# 独立 workspace：不进入根 workspace，也不影响现有 `cargo build --workspace`。
[workspace]

[dependencies]
ammonia = "4"
anyhow = "1"
askama = "0.12"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
pulldown-cmark = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
tower-http = { version = "0.6", features = ["trace", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
