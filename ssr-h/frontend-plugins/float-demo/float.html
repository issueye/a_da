<!--
  插件片段：挂到输入框上方的悬浮点位（composer.above 插槽）。

  这个位置的特点：
  - 服务端渲染进 HTML，首屏即可见；
  - 悬浮在对话流之上、贴着输入框（sticky 吸底），滚动到底时落到内容末尾；
  - 插件可以自带 JS（见下方 script 标签）做数据增强，失败也不影响主界面。
-->
<div class="ada-float" data-float-demo>
  <div class="ada-float__head">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="m12 2.5 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/>
    </svg>
    <span>插件悬浮点位</span>
    <span class="ada-float__badge">composer.above</span>
  </div>
  <p class="ada-float__text" data-float-status>正在读取插件状态…</p>
</div>
<script src="/ext/float-demo/assets/float.js"></script>
